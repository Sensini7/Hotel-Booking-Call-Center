name: receiving first call workflow

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Create Lambda Deployment Packages
        run: |
          echo "Creating DB Lookup Lambda package..."
          cd terraform/modules/lambda-function
          python -m zipfile -c lambda_function.zip lambda_function.py
          ls -la lambda_function.zip

          echo "Creating Lex Lambda package..."
          cd ../lex-lambda-function
          python -m zipfile -c lambda_function.zip lambda_function.py
          ls -la lambda_function.zip

          echo "Creating SES Lambda package..."
          cd ../ses-lambda-function
          python -m zipfile -c lambda_function.zip lambda_function.py
          ls -la lambda_function.zip

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ./terraform
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=amazon-connect/employee-booking/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"
        working-directory: ./terraform

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ./terraform

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="connect_instance_id=${{ secrets.CONNECT_INSTANCE_ID }}" \
            -var="instance_phone_number_id=${{ secrets.INSTANCE_PHONE_NUMBER_ID }}" \
            -var="user_password=${{ secrets.USER_PASSWORD }}" \
            -out=tfplan
        working-directory: ./terraform

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfplan
          path: ./terraform/tfplan
          retention-days: 1

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform
    environment:
      name: production
      url: https://console.aws.amazon.com/connect/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Create Lambda Deployment Packages
        run: |
          echo "Creating DB Lookup Lambda package..."
          cd terraform/modules/lambda-function
          python -m zipfile -c lambda_function.zip lambda_function.py
          ls -la lambda_function.zip

          echo "Creating Lex Lambda package..."
          cd ../lex-lambda-function
          python -m zipfile -c lambda_function.zip lambda_function.py
          ls -la lambda_function.zip

          echo "Creating SES Lambda package..."
          cd ../ses-lambda-function
          python -m zipfile -c lambda_function.zip lambda_function.py
          ls -la lambda_function.zip

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=amazon-connect/employee-booking/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"
        working-directory: ./terraform

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan
        working-directory: ./terraform

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Create Lambda Deployment Packages
        run: |
          echo "Creating DB Lookup Lambda package..."
          cd terraform/modules/lambda-function
          python -m zipfile -c lambda_function.zip lambda_function.py
          ls -la lambda_function.zip

          echo "Creating Lex Lambda package..."
          cd ../lex-lambda-function
          python -m zipfile -c lambda_function.zip lambda_function.py
          ls -la lambda_function.zip

          echo "Creating SES Lambda package..."
          cd ../ses-lambda-function
          python -m zipfile -c lambda_function.zip lambda_function.py
          ls -la lambda_function.zip

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=amazon-connect/employee-booking/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"
        working-directory: ./terraform

      - name: Empty S3 CCP Bucket Before Destroy
        run: |
          BUCKET_NAME=$(terraform output -raw ccp_s3_bucket_name 2>/dev/null || echo "")
          if [ ! -z "$BUCKET_NAME" ]; then
            echo "Emptying S3 bucket: $BUCKET_NAME"
            aws s3 rm s3://$BUCKET_NAME --recursive || true
          else
            echo "CCP S3 bucket not found or already destroyed"
          fi
        working-directory: ./terraform
        continue-on-error: true

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve -input=false \
            -var="connect_instance_id=${{ secrets.CONNECT_INSTANCE_ID }}" \
            -var="instance_phone_number_id=${{ secrets.INSTANCE_PHONE_NUMBER_ID }}" \
            -var="user_password=${{ secrets.USER_PASSWORD }}"
        working-directory: ./terraform
